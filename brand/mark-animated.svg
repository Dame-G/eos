<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="eos-title">
  <title id="eos-title">EOS</title>
  <style>
    :root {
      --eos-face: #17586d;      /* --e-primary */
      --eos-slab: #104251;      /* --e-primary-slab */
      --eos-on: #ffffff;        /* --e-on-primary */
      --eos-word: #17586d;
    }
    @media (prefers-color-scheme: dark) { :root { --eos-word: #e8f1f3; } }
    .face  { fill: var(--eos-face); }
    .slab  { fill: var(--eos-slab); }
    .glyph { fill: var(--eos-on); }
    .tile       { transform-box: fill-box; transform-origin: center; animation: eos-in .45s cubic-bezier(.3,.7,.2,1) both; }
    .glyph      { animation: eos-glyph .6s .2s cubic-bezier(.2,.75,.2,1) both; }
    .face-group { animation: eos-press .34s 1s ease-in-out both; }
    .word       { animation: eos-word .7s cubic-bezier(.2,.7,.2,1) both; }
    .w1 { animation-delay: .6s; }
    .w2 { animation-delay: .7s; }
    .w3 { animation-delay: .8s; }

    @keyframes eos-in    { from { opacity: 0; transform: scale(.88); } }
    @keyframes eos-glyph { from { opacity: 0; transform: translateY(4px); } }
    /* One click: the face sinks into its slab and lifts back, as a button does on press. */
    @keyframes eos-press { 45% { transform: translateY(5px); } }
    @keyframes eos-word  { from { opacity: 0; transform: translateX(-6px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="tile">
  <!-- Built like an EButton: a slab-coloured body with the face set into it, the bottom edge
       thicker by the depth. -->
  <rect x="4" y="4" width="56" height="55" rx="12" class="slab"/>
  <g class="face-group">
    <rect x="5.5" y="5.5" width="53" height="48.5" rx="10.5" class="face"/>
    <path d="M33.11 46.25L33.11 46.25Q28.14 46.25 24.27 44.13Q20.41 42.00 18.15 38.27Q15.89 34.53 15.89 29.75L15.89 29.75Q15.89 25.04 18.09 21.34Q20.28 17.64 24.08 15.45Q27.87 13.25 32.52 13.25L32.52 13.25Q37.11 13.25 40.61 15.32Q44.11 17.38 46.11 20.95Q48.11 24.52 48.11 29.03L48.11 29.03Q48.11 29.89 48.01 30.77Q47.91 31.65 47.65 32.77L47.65 32.77L24.54 32.83Q24.80 33.81 25.26 34.60L25.26 34.60Q26.30 36.76 28.33 37.91Q30.36 39.05 33.05 39.05L33.05 39.05Q35.47 39.05 37.43 38.23Q39.40 37.42 40.84 35.78L40.84 35.78L45.88 40.82Q43.59 43.50 40.28 44.88Q36.98 46.25 33.11 46.25ZM24.54 26.42L24.54 26.42L39.86 26.35Q39.59 25.24 39.20 24.32L39.20 24.32Q38.29 22.42 36.62 21.41Q34.95 20.39 32.52 20.39L32.52 20.39Q29.97 20.39 28.07 21.54Q26.17 22.68 25.19 24.71L25.19 24.71Q24.80 25.50 24.54 26.42Z" class="glyph"/>
  </g>
  </g>
</svg>

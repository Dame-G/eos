<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 64" role="img" aria-labelledby="eos-title">
  <title id="eos-title">eos</title>
  <style>
    :root {
      --eos-face: #005f7c;      /* --e-primary */
      --eos-slab: #004357;      /* --e-primary-slab: the primary with 30% black */
      --eos-on: #ffffff;        /* --e-on-primary: 7.2:1 on the face */
      --eos-word: #005f7c;      /* --e-primary */
    }
    @media (prefers-color-scheme: dark) { :root { --eos-word: #e8f1f3; } }
    .face  { fill: var(--eos-face); }
    .slab  { fill: var(--eos-slab); }
    .glyph { fill: var(--eos-on); }
    .word  { fill: var(--eos-word); }
    .tile       { transform-box: fill-box; transform-origin: center; animation: eos-in .45s cubic-bezier(.3,.7,.2,1) both; }
    .glyph      { animation: eos-glyph .6s .2s cubic-bezier(.2,.75,.2,1) both; }
    .face-group { animation: eos-press .34s 1s ease-in-out both; }
    .word       { animation: eos-word .7s cubic-bezier(.2,.7,.2,1) both; }
    .w1 { animation-delay: .6s; }
    .w2 { animation-delay: .7s; }
    .w3 { animation-delay: .8s; }

    @keyframes eos-in    { from { opacity: 0; transform: scale(.88); } }
    @keyframes eos-glyph { from { opacity: 0; transform: translateY(4px); } }
    /* One click: the face sinks into its slab and lifts back, as a button does on press. */
    @keyframes eos-press { 45% { transform: translateY(5px); } }
    @keyframes eos-word  { from { opacity: 0; transform: translateX(-6px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="tile">
  <!-- Built like an EButton: a slab-coloured body with the face set into it, the bottom edge
       thicker by the depth. -->
  <rect x="4" y="4" width="56" height="55" rx="12" class="slab"/>
  <g class="face-group">
    <rect x="5.5" y="5.5" width="53" height="48.5" rx="10.5" class="face"/>

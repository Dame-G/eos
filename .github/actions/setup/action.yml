name: Set up eos
description: Installs pnpm, Node and the dependencies.
inputs:
  node-version:
    description: Node version
    default: "24"
  registry-url:
    description: npm registry to write an .npmrc for (publishing only)
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

name: Feature request
description: Suggest a component, prop or token
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that eos does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include the accessibility behaviour you expect (keyboard, roles, announcements).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eos-ui/vue exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm check:size
      - run: pnpm typecheck
      - run: pnpm --filter @eos-ui/vue check:css
      - run: pnpm --filter @eos-ui/vue check:layers
      - run: pnpm --filter @eos-ui/vue check:props
      - run: pnpm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke

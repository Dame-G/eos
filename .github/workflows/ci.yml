name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Nightly: the tests in Firefox and WebKit, which pull requests skip to stay fast.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main always finish, since Release waits for them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  # Everything that reads the source: generated files, CSS rules, layers, props tables, README links, lint, formatting,
  # types (including test/types.test-d.ts) and unused code.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The source checks import @eos-ui/tokens, which resolves to its build.
      - run: pnpm tokens
      # Before typecheck, which regenerates index.ts, globals.ts and component-names.ts: fails when the committed ones are stale.
      - run: pnpm check:source
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm knip

  # Real-browser tests in Chromium.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @eos-ui/vue exec playwright install --with-deps chromium
      - run: pnpm test

  # What gets published, built once: size budgets, server render, the built stylesheet, then the packed tarballs
  # (publint, attw) installed in a fresh app. On Node 22, the lowest supported version.
  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm smoke --no-build

  # A change under packages/ needs a changeset, unless the pull request carries the `no-changeset` label (docs wording, tests, internal refactors).
  changeset:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset') &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm changeset status --since=origin/${{ github.base_ref }}

  # The one check branch protection requires, so adding or renaming a job above never touches the rule. A skipped job
  # (changeset with the label) counts as passing.
  ci-ok:
    if: always() && github.event_name != 'schedule'
    needs: [lint, test, package, changeset]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job did not pass."
            exit 1
          fi

  # Nightly and on demand. Never blocks a pull request: engines differ in small ways, and a failure here is read, not gated.
  browsers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    env:
      EOS_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @eos-ui/vue exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly browser tests failed"
          body="The Firefox and WebKit run failed: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

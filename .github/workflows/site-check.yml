name: Site check

# Builds the docs site (Dame-G/eos-site) against this PR, so a token or API
# rename that would break the site shows up here. Not a required check.
#
# The site repo is private, so the default token cannot read it. Add a secret
# named SITE_REPO_TOKEN (a fine-grained token with read access to the contents of
# Dame-G/eos-site). Without it, and on PRs from forks, the job skips.
on:
  pull_request:
    paths:
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_SITE_TOKEN: ${{ secrets.SITE_REPO_TOKEN != '' }}
    steps:
      - name: Skip without a site token
        if: env.HAS_SITE_TOKEN != 'true'
        run: echo "SITE_REPO_TOKEN is not set, so the site is not built."
      - uses: actions/checkout@v7
        if: env.HAS_SITE_TOKEN == 'true'
        with:
          path: eos
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.HAS_SITE_TOKEN == 'true'
        with:
          repository: Dame-G/eos-site
          ref: main
          path: eos-site
          token: ${{ secrets.SITE_REPO_TOKEN }}
          persist-credentials: false
      - if: env.HAS_SITE_TOKEN == 'true'
        run: corepack enable
      - uses: actions/setup-node@v7
        if: env.HAS_SITE_TOKEN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            eos-site/pnpm-lock.yaml
            eos/pnpm-lock.yaml

      - name: Install and build the library
        if: env.HAS_SITE_TOKEN == 'true'
        working-directory: eos
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 build

      - name: Install the site
        if: env.HAS_SITE_TOKEN == 'true'
        working-directory: eos-site
        run: pnpm install --frozen-lockfile

      - name: Build the docs
        if: env.HAS_SITE_TOKEN == 'true'
        working-directory: eos-site
        run: pnpm docs:build

      - name: Check server rendering
        if: env.HAS_SITE_TOKEN == 'true'
        working-directory: eos-site
        run: pnpm ssr:check

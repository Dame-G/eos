name: Site check

# Builds and checks the docs site (Dame-G/eos-site, main) against this pull request, with the site's own CI steps, so a
# token or API rename that would break the site shows up here. Not a required check.
on:
  pull_request:
    paths:
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Dame-G/eos-site
          path: eos-site
          persist-credentials: false
      - uses: ./eos-site/.github/actions/verify
        with:
          eos-ref: ${{ github.event.pull_request.head.sha || github.sha }}
